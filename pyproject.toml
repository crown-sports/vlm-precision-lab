[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-precision-lab"
version = "0.2.0"
description = "Check quantized vision models against image tasks and service budgets"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["Pillow>=10.4,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
plot = ["matplotlib>=3.9,<4"]
data = ["pyarrow>=21,<24"]

[project.scripts]
precisionlab = "precisionlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
