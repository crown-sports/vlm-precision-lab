name: Publish recorded demo
on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'examples/diagnostic-v2/**'
      - 'experiments/build_demo.py'
      - 'experiments/results/2026-10-03/**'
      - 'src/precisionlab/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python experiments/build_demo.py --output runs/site/index.html --copy-images
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: runs/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
